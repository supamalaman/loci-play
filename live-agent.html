<style>
:root{--bar:#101824;--panel:#172235;--line:#2d3d55;--ink:#f2efe8;--muted:#a9b7c9;--gold:#f2c96e;--wait:#f2c96e;--ok:#7fd69a;--ai:#85cfff;--bad:#ff8f8f}
html,body{height:100%;margin:0;background:var(--bar)}body{display:flex;flex-direction:column;color:var(--ink);font:14px system-ui}
#duelHost{flex:1;min-height:0;padding:8px 12px}
.agent-bar{display:flex;align-items:stretch;gap:10px;padding:10px 14px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.step>b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px}
.step.done>b{background:var(--ok);color:#10202a}.step.now>b{background:var(--gold);color:#18202b}
.agent-bar button,.agent-bar select{font:inherit;padding:7px 10px;border:1px solid #75859a;border-radius:6px;background:#243247;color:#fff}
.agent-bar select{max-width:190px}.agent-bar button.primary{background:var(--gold);color:#18202b;border-color:var(--gold);font-weight:650}
.agent-bar button:hover:not(:disabled){filter:brightness(1.15)}.agent-bar button:focus-visible,.agent-bar select:focus-visible{outline:3px solid #85cfff;outline-offset:2px}
.agent-bar button:disabled,.agent-bar select:disabled{background:#465366;color:#d5dce6;cursor:default;border-color:#5a6779}
.agent-bar label{display:flex;align-items:center;gap:6px;color:var(--muted)}.agent-bar span,.agent-bar button{white-space:nowrap}
.connect{flex:1 1 300px;min-width:0;flex-wrap:nowrap}.connect code{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px ui-monospace,monospace;color:var(--muted);background:#0c131d;padding:6px 8px;border-radius:5px}
.status{display:flex;flex-direction:column;justify-content:center;gap:5px;flex:1 1 240px;min-width:220px}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:600}.pill i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.status[data-state=waiting] .pill i{background:var(--wait);animation:pulse 1.1s infinite}.status[data-state=chose] .pill i{background:var(--ok)}
.status[data-state=builtin] .pill i{background:var(--ai)}.status[data-state=lost] .pill i{background:var(--bad)}
.clock{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.clock span{display:block;height:100%;width:0;background:var(--wait);transition:width .4s linear}
.status:not([data-state=waiting]) .clock{visibility:hidden}
@keyframes pulse{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.status .pill i{animation:none}}
@media(max-width:760px){.status{margin:0;width:100%}.agent-bar select{max-width:none}}
</style>
</head>

  <!-- Agent duel (Codex prototype; UI pass by Claude, 2026-10-26): pick fighters and an arena, start, then hand the
       command to an active agent. The status pill says who controls the agent's fighter and how long the agent has left. -->
  <header class="agent-bar">
    <div class="step now" id="stepPick"><b>1</b>
      <label>You <select id="human"></select></label>
      <label>Agent plays <select id="opponent"></select></label>
      <label>Arena <select id="arena"></select></label>
      <button id="agentStart" class="primary">Start agent duel</button>
      <button id="agentRelease" disabled title="Hand the agent's fighter to the built-in AI; Attach agent gives it back">Use built-in AI</button>
    </div>
    <div class="step connect" id="stepConnect"><b>2</b>
      <span>Agent command</span>
      <code id="agentCommand" title="The agent runs this to see its pending turn">loading…</code>
      <button id="agentCopy">Copy command</button>
    </div>
    <div class="status" id="agentState" data-state="idle">
      <span class="pill"><i></i><output id="agentStatus" aria-live="polite">Loading agent connection…</output></span>
      <div class="clock" aria-hidden="true"><span id="agentClock"></span></div>
    </div>
  </header>
  <div id="duelHost"></div>
